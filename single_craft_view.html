<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="robots" content="noindex"/>
    <title>Orneril | Artestoa</title>
    <!-- Old address for Orneril's work pages, from before Orneril joined the Artestoa hall -->
    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        params.delete('id');
        const qs = params.toString();
        location.replace(id ? `/orneril/${encodeURIComponent(id)}${qs ? `?${qs}` : ''}` : '/orneril');
    </script>
</head>
<body></body>
</html>
