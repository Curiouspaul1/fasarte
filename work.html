<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Gallery</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "media",
        theme: {
          extend: {
            colors: {
              // Each gallery's accent (catalogue theme) arrives as --accent
              primary: "rgb(var(--accent) / <alpha-value>)",
              "background-light": "#F4F1EA",
              "background-dark": "#141413",
              "text-primary-light": "#262626",
              "text-primary-dark": "#F5F5F5",
              "text-secondary-light": "#5C5A55",
              "text-secondary-dark": "#A3A3A3",
            },
            fontFamily: {
              display: ["Playfair Display", "serif"],
              body: ["Inter", "sans-serif"],
            },
            boxShadow: {
                'glow': '0 0 20px rgba(107, 142, 35, 0.3)',
            },
          },
        },
      };
    </script>
    <style>
        :root { --accent: 107 142 35; }
        @view-transition { navigation: auto; }
        ::view-transition-group(artwork) { animation-duration: 0.55s; animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }

        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300; }
        .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 400; }

        img {
            -webkit-user-drag: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body { overscroll-behavior-y: none; }

        /* The stage: a dark gallery wall with a single spotlight */
        #stage {
            background:
                radial-gradient(55% 45% at 50% 38%, rgba(255, 244, 220, .10), transparent 70%),
                #0e0e0d;
        }
        /* Coloured light in the work's bead palette (glowFor in core/fasarte.js) */
        #stage-blur {
            position: absolute; inset: 0;
            opacity: .55;
        }

        #zoom-target {
            position: relative;
            display: inline-block;
            line-height: 0;
            cursor: zoom-in;
            touch-action: pan-y;
        }
        #main-image {
            max-width: 100%;
            /* stage (66vh) minus its top/bottom padding, and minus the thumbnail row when present */
            max-height: calc(66vh - 104px);
            width: auto;
            height: auto;
            box-shadow: 0 40px 80px -30px rgba(0,0,0,.8);
            transition: opacity .35s ease;
            view-transition-name: artwork;
        }
        #stage.has-thumbs #main-image { max-height: calc(66vh - 192px); }
        @media (min-width: 1024px) {
            #main-image { max-height: calc(100vh - 140px); }
            #stage.has-thumbs #main-image { max-height: calc(100vh - 228px); }
        }
        #main-image.swapping { opacity: 0; }

        #magnifying-glass {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 50;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background-repeat: no-repeat;
            background-color: #0e0e0d;
            transform: translate3d(0,0,0);
            will-change: transform;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.55),
                        0 10px 40px rgba(0, 0, 0, 0.55),
                        inset 0 0 20px rgba(0,0,0,0.25);
        }
        @media (max-width: 767px) { #magnifying-glass { width: 130px; height: 130px; } }
        #zoom-level {
            position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%);
            font-size: 10px; letter-spacing: .15em; color: rgba(255,255,255,.75);
        }

        .hint-touch { display: none; }
        @media (hover: none) {
            .hint-touch { display: inline; }
            .hint-mouse { display: none; }
        }

        .thumb { opacity: .5; transition: opacity .3s ease, outline-color .3s ease; outline: 1px solid transparent; outline-offset: 3px; }
        .thumb:hover { opacity: .85; }
        .thumb[aria-current="true"] { opacity: 1; outline-color: rgba(255,255,255,.8); }

        .stage-arrow { opacity: .7; transition: opacity .3s ease, transform .3s ease, background-color .3s ease; }
        .stage-arrow:hover { opacity: 1; transform: scale(1.06); }

        #reveal > * { animation: rise .7s cubic-bezier(0.25, 1, 0.5, 1) both; }
        #reveal > *:nth-child(2) { animation-delay: .06s; }
        #reveal > *:nth-child(3) { animation-delay: .12s; }
        #reveal > *:nth-child(4) { animation-delay: .18s; }
        #reveal > *:nth-child(5) { animation-delay: .24s; }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        /* Phones: once the photo has scrolled away, the floating buttons would sit on the
           text, so the bar becomes solid and the buttons switch to the page's colours */
        #top-bar { transition: background-color .3s ease, box-shadow .3s ease; }
        #top-bar.solid {
            background: rgba(244, 241, 234, .94);
            box-shadow: 0 1px 0 rgba(0,0,0,.06);
        }
        #top-bar.solid a, #top-bar.solid button { background: rgba(0,0,0,.06); color: #262626; }
        @media (prefers-color-scheme: dark) {
            #top-bar.solid { background: rgba(20, 20, 19, .94); box-shadow: 0 1px 0 rgba(255,255,255,.06); }
            #top-bar.solid a, #top-bar.solid button { background: rgba(255,255,255,.08); color: #f5f5f5; }
        }
        #top-bar.solid #fav-btn[aria-pressed="true"] span { color: #e0455f; }

        #toast { transition: opacity .3s ease, transform .3s ease; }
        #toast:not(.show) { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }

        @media (prefers-reduced-motion: reduce) {
            #reveal > * { animation: none; }
        }
    </style>
    <script>
        // A page transition the browser skips (e.g. the tab is in the background) rejects
        // its promises; that's expected, so keep it out of the console
        addEventListener('pageswap', (e) => e.viewTransition?.ready.catch(() => {}));
        addEventListener('pagereveal', (e) => e.viewTransition?.ready.catch(() => {}));
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-primary-light dark:text-text-primary-dark font-body antialiased selection:bg-primary/30">

    <!-- Tour progress -->
    <div id="tour-bar" class="hidden fixed top-0 left-0 right-0 h-[3px] z-[45] bg-white/10">
        <div id="tour-progress" class="h-full bg-primary transition-[width] duration-700"></div>
    </div>

    <nav id="top-bar" class="fixed lg:absolute top-0 left-0 right-0 p-4 md:p-6 flex justify-between items-center z-40 pointer-events-none lg:w-1/2">
        <a id="back-link" href="#" aria-label="Back to the gallery" class="h-10 pl-3 pr-4 rounded-full bg-black/30 backdrop-blur-md flex items-center gap-1.5 text-white text-xs font-medium tracking-wide pointer-events-auto transition-transform hover:scale-105 active:scale-95">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span id="back-label">Gallery</span>
        </a>
        <p id="tour-label" class="hidden text-white/80 text-[10px] uppercase tracking-[0.3em] bg-black/30 backdrop-blur-md px-4 py-2 rounded-full"></p>
        <div class="flex gap-3 pointer-events-auto">
            <span id="sound-slot" class="flex"></span>
            <button id="share-btn" aria-label="Share this work" class="w-10 h-10 rounded-full bg-black/30 backdrop-blur-md flex items-center justify-center text-white transition-transform hover:scale-105 active:scale-95">
                <span class="material-symbols-outlined text-[20px]">ios_share</span>
            </button>
            <button id="fav-btn" aria-label="Save this work" aria-pressed="false" class="w-10 h-10 rounded-full bg-black/30 backdrop-blur-md flex items-center justify-center text-white transition-transform hover:scale-105 active:scale-95">
                <span class="material-symbols-outlined text-[20px]">favorite</span>
            </button>
        </div>
    </nav>

    <main class="min-h-screen lg:grid lg:grid-cols-2">

        <!-- ===== Stage ===== -->
        <section id="stage" class="relative h-[66vh] lg:h-screen w-full overflow-hidden lg:sticky lg:top-0 flex flex-col items-center justify-center px-6 pt-16 pb-10 lg:py-16">
            <div id="stage-blur" aria-hidden="true"></div>

            <div class="relative flex-1 min-h-0 w-full flex items-center justify-center">
                <div id="zoom-target">
                    <img id="main-image" alt="" src=""/>
                    <div id="magnifying-glass" aria-hidden="true"><span id="zoom-level"></span></div>
                </div>
            </div>

            <div id="thumbs" class="relative z-10 mt-6 flex gap-3 empty:hidden" role="tablist" aria-label="Views of this work"></div>

            <button id="stage-prev" class="stage-arrow absolute left-3 md:left-5 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md text-white flex items-center justify-center z-20">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <button id="stage-next" class="stage-arrow absolute right-3 md:right-5 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md text-white flex items-center justify-center z-20">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>

            <div id="hint-overlay" class="absolute top-[26px] lg:top-auto lg:bottom-6 left-0 right-0 text-center pointer-events-none transition-opacity duration-500 z-10">
                <span class="inline-block bg-black/40 backdrop-blur-md text-white/90 px-4 py-1.5 rounded-full text-[10px] font-medium uppercase tracking-[0.2em] border border-white/15">
                    <span class="hint-touch">Hold to zoom</span>
                    <span class="hint-mouse">Hover to inspect · scroll to zoom</span>
                </span>
            </div>
        </section>

        <!-- ===== Placard ===== -->
        <section class="relative z-10 px-6 lg:px-16 pt-10 pb-36 lg:py-20 bg-background-light dark:bg-background-dark rounded-t-3xl lg:rounded-none -mt-6 lg:mt-0 lg:flex lg:flex-col lg:justify-center">
            <div id="reveal" class="max-w-lg mx-auto lg:mx-0 w-full">

                <div class="mb-8 text-center lg:text-left">
                    <p class="text-[11px] font-semibold tracking-[0.3em] uppercase text-primary mb-4">
                        <a id="room-link" href="#" class="hover:underline underline-offset-4"></a>
                    </p>
                    <h1 id="craft-title" class="font-display text-4xl lg:text-6xl font-medium italic leading-[1.05] mb-3"></h1>
                    <p id="craft-series" class="hidden text-sm text-text-secondary-light dark:text-text-secondary-dark mb-1"></p>
                    <p id="craft-type" class="text-[11px] uppercase tracking-[0.2em] text-text-secondary-light dark:text-text-secondary-dark"></p>
                    <a id="craft-artist" href="#" class="inline-block mt-3 text-sm italic text-text-secondary-light dark:text-text-secondary-dark hover:text-primary transition-colors"></a>
                </div>

                <div class="mb-10">
                    <h2 class="text-[11px] uppercase tracking-[0.25em] font-semibold mb-3">Curator's Note</h2>
                    <p id="craft-description" class="text-text-secondary-light dark:text-text-secondary-dark leading-relaxed font-light text-lg lg:text-xl"></p>
                </div>

                <dl class="grid grid-cols-3 gap-4 py-6 border-t border-b border-black/10 dark:border-white/10 mb-10">
                    <div class="text-center lg:text-left">
                        <dt class="text-[10px] uppercase tracking-wider text-text-secondary-light dark:text-text-secondary-dark mb-2">Year</dt>
                        <dd id="spec-year" class="font-display text-lg font-medium"></dd>
                    </div>
                    <div class="text-center lg:text-left border-l border-black/10 dark:border-white/10 pl-4">
                        <dt class="text-[10px] uppercase tracking-wider text-text-secondary-light dark:text-text-secondary-dark mb-2">Catalogue</dt>
                        <dd id="spec-no" class="font-display text-lg font-medium"></dd>
                    </div>
                    <div class="text-center lg:text-left border-l border-black/10 dark:border-white/10 pl-4">
                        <dt class="text-[10px] uppercase tracking-wider text-text-secondary-light dark:text-text-secondary-dark mb-2">Views</dt>
                        <dd id="spec-views" class="font-display text-lg font-medium"></dd>
                    </div>
                    <div class="col-span-3 text-center lg:text-left pt-4 border-t border-black/5 dark:border-white/5">
                        <dt class="text-[10px] uppercase tracking-wider text-text-secondary-light dark:text-text-secondary-dark mb-2">Medium</dt>
                        <dd id="spec-materials" class="font-display text-lg font-medium"></dd>
                    </div>
                </dl>

                <div class="mb-12 flex items-center justify-center lg:justify-start gap-4">
                    <span class="text-[10px] uppercase tracking-wider text-text-secondary-light dark:text-text-secondary-dark">Palette</span>
                    <div id="palette" class="flex -space-x-1.5"></div>
                </div>

                <a id="next-card" href="#" class="group hidden lg:flex items-center gap-5 p-4 -mx-4 rounded-2xl hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                    <img id="next-thumb" src="" alt="" class="w-16 h-20 object-cover shadow-md"/>
                    <span class="flex-1 min-w-0">
                        <span id="next-kicker" class="block text-[10px] uppercase tracking-[0.25em] text-text-secondary-light dark:text-text-secondary-dark mb-1">Next in the gallery</span>
                        <span id="next-title" class="block font-display text-2xl italic truncate"></span>
                    </span>
                    <span class="material-symbols-outlined text-primary transition-transform group-hover:translate-x-1">arrow_forward</span>
                </a>
                <p class="hidden lg:block mt-8 text-[11px] text-text-secondary-light/80 dark:text-text-secondary-dark/80">Tip: use ← → to walk the gallery, Esc to step back.</p>
            </div>
        </section>
    </main>

    <!-- Mobile: continue walking -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-xl z-40 border-t border-black/5 dark:border-white/10 lg:hidden">
        <a id="next-mobile" href="#" class="w-full bg-primary hover:opacity-90 text-white py-4 rounded-xl font-medium shadow-glow flex items-center justify-center gap-2 transform active:scale-[0.98] transition-all">
            <span id="next-mobile-label">Next work</span>
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </a>
    </div>

    <div id="toast" role="status" class="fixed left-1/2 -translate-x-1/2 bottom-28 lg:bottom-10 z-50 bg-gray-900 text-white dark:bg-white dark:text-gray-900 text-sm px-5 py-2.5 rounded-full shadow-xl"></div>

    <script src="/artists/registry.js"></script>
<script src="/core/fasarte.js"></script>
<script src="/core/sound.js"></script>
<script>
// /<maker>/<work>[?tour=1] (or work.html?a=<maker>&id=<work> as a fallback)
document.getElementById('sound-slot').append(Sound.button('w-10 h-10 rounded-full bg-black/30 backdrop-blur-md flex items-center justify-center text-white transition-transform hover:scale-105 active:scale-95'));

Fasarte.currentCatalogue().then((catalogue) => {
    const myGalleryData = catalogue.works;
    const galleryRooms = catalogue.rooms;
    const { glowFor } = Fasarte;
    Fasarte.applyTheme(catalogue.theme);

    // --- 1. WHICH WORK? ---
    const params = new URLSearchParams(window.location.search);
    const touring = params.get('tour') === '1';
    const work = catalogue.find(Fasarte.route().work) || myGalleryData[0];
    const room = galleryRooms.find((r) => r.id === work.room);

    // Walking order: the guided tour covers the titled works; free browsing covers everything
    const tourSkips = catalogue.gallery.tourSkips || [];
    const route = touring ? myGalleryData.filter((w) => !tourSkips.includes(w.room)) : myGalleryData;
    const pos = Math.max(0, route.indexOf(work));
    const prevWork = route[pos - 1];
    const nextWork = route[pos + 1];
    const linkTo = (w) => Fasarte.workUrl(w, touring ? { tour: 1 } : {});
    const galleryUrl = Fasarte.galleryUrl(catalogue.slug, `w-${work.id}`);

    // --- 2. PLACARD ---
    // Mention the hall only to visitors who came through it (see cameThroughHall in core)
    const inHall = Fasarte.cameThroughHall() && !Fasarte.isDetached(catalogue.slug);
    document.title = `${work.title} · ${catalogue.gallery.title}${inHall ? ' | Fasarte' : ''}`;
    const $ = (id) => document.getElementById(id);

    $('room-link').textContent = `Room ${room.numeral} · ${room.title}`;
    $('room-link').href = Fasarte.galleryUrl(catalogue.slug, `room-${room.id}`);
    $('craft-title').textContent = work.title;
    if (work.series) {
        $('craft-series').textContent = `From the series ${work.series}`;
        $('craft-series').classList.remove('hidden');
    }
    $('craft-type').textContent = work.type;
    $('craft-artist').textContent = `Handmade by ${catalogue.artist.name || `${catalogue.gallery.title} Studio`}`;
    $('craft-artist').href = Fasarte.galleryUrl(catalogue.slug, 'room-artist');
    $('craft-description').textContent = work.description;
    $('spec-year').textContent = work.year || 'Undated';
    $('spec-no').textContent = `No. ${work.no}`;
    $('spec-views').textContent = work.images.length;
    $('spec-materials').textContent = work.materials;
    $('palette').innerHTML = work.palette
        .map((c) => `<span class="w-7 h-7 rounded-full ring-2 ring-background-light dark:ring-background-dark shadow" style="background:${c}" title="${c}"></span>`)
        .join('');
    $('back-link').href = galleryUrl;

    // Tour progress
    if (touring) {
        $('tour-bar').classList.remove('hidden');
        $('tour-progress').style.width = `${((pos + 1) / route.length) * 100}%`;
        $('tour-label').textContent = `Stop ${pos + 1} of ${route.length}`;
        $('tour-label').classList.add('md:block');
        $('back-label').textContent = 'Leave tour';
        // The stop counter takes the top-centre spot that the zoom hint uses on small screens
        $('hint-overlay').classList.add('max-lg:hidden');
    }

    // Next / previous
    const endHref = touring ? galleryUrl : Fasarte.galleryUrl(catalogue.slug, 'about');
    $('next-card').href = nextWork ? linkTo(nextWork) : endHref;
    $('next-thumb').src = (nextWork || work).images[0].sm;
    $('next-kicker').textContent = nextWork ? (touring ? `Next stop · ${pos + 2} of ${route.length}` : 'Next in the gallery') : 'You have reached the end';
    $('next-title').textContent = nextWork ? nextWork.title : (touring ? 'Return to the gallery' : 'Exit through the studio');
    $('next-mobile').href = nextWork ? linkTo(nextWork) : endHref;
    $('next-mobile-label').textContent = nextWork ? `Next: ${nextWork.title}` : (touring ? 'End of tour · Back to gallery' : 'Back to the gallery');

    const stagePrev = $('stage-prev');
    const stageNext = $('stage-next');
    stagePrev.setAttribute('aria-label', prevWork ? `Previous work: ${prevWork.title}` : 'No previous work');
    stageNext.setAttribute('aria-label', nextWork ? `Next work: ${nextWork.title}` : 'No next work');
    stagePrev.disabled = !prevWork;
    stageNext.disabled = !nextWork;
    stagePrev.classList.toggle('invisible', !prevWork);
    stageNext.classList.toggle('invisible', !nextWork);
    stagePrev.addEventListener('click', () => prevWork && (location.href = linkTo(prevWork)));
    stageNext.addEventListener('click', () => nextWork && (location.href = linkTo(nextWork)));

    document.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === 'ArrowLeft' && prevWork) location.href = linkTo(prevWork);
        if (e.key === 'ArrowRight' && nextWork) location.href = linkTo(nextWork);
        if (e.key === 'Escape') location.href = galleryUrl;
    });

    // Warm the cache for the next stop so the walk feels instant
    if (nextWork) new Image().src = nextWork.images[0].src;

    $('stage-blur').style.backgroundImage = glowFor(work, { at: [50, 45] });

    // --- 3. VIEWS ---
    const mainImage = $('main-image');
    const thumbs = $('thumbs');
    const lens = $('magnifying-glass');
    let current = -1;

    function showView(i) {
        if (i === current) return;
        const shot = work.images[i];
        const first = current === -1;
        current = i;

        const apply = () => {
            mainImage.src = shot.src;
            mainImage.alt = work.images.length > 1 ? `${work.title}, view ${i + 1} of ${work.images.length}` : work.title;
            lens.style.backgroundImage = `url('${shot.src}')`;
        };
        if (first) {
            apply();
        } else {
            mainImage.classList.add('swapping');
            setTimeout(() => {
                apply();
                const done = () => mainImage.classList.remove('swapping');
                mainImage.complete ? done() : mainImage.addEventListener('load', done, { once: true });
            }, 200);
        }
        thumbs.querySelectorAll('.thumb').forEach((t, j) => t.setAttribute('aria-current', String(j === i)));
    }

    if (work.images.length > 1) {
        $('stage').classList.add('has-thumbs');
        thumbs.innerHTML = work.images.map((shot, i) => `
            <button class="thumb" role="tab" aria-label="View ${i + 1}" data-i="${i}">
                <img src="${shot.sm}" alt="" class="w-12 h-16 object-cover"/>
            </button>`).join('');
        thumbs.addEventListener('click', (e) => {
            const btn = e.target.closest('.thumb');
            if (btn) showView(Number(btn.dataset.i));
        });
        // Preload the other views
        work.images.slice(1).forEach((shot) => (new Image().src = shot.src));
    }
    showView(0);

    // --- 4. MAGNIFIER ---
    // The lens is positioned against the image element itself, so it always matches
    // what is actually on screen (no object-fit cropping to account for).
    const target = $('zoom-target');
    const hint = $('hint-overlay');
    const zoomLabel = $('zoom-level');

    let zoom = 2.5;
    let isVisible = false;
    let cursorX = 0;
    let cursorY = 0;
    let rafPending = false;

    function draw() {
        rafPending = false;
        if (!isVisible) return;
        const rect = mainImage.getBoundingClientRect();
        const x = cursorX - rect.left;
        const y = cursorY - rect.top;

        if (x < 0 || x > rect.width || y < 0 || y > rect.height) { hideLens(); return; }

        const lw = lens.offsetWidth;
        const lh = lens.offsetHeight;
        lens.style.transform = `translate3d(${x - lw / 2}px, ${y - lh / 2}px, 0)`;
        lens.style.backgroundSize = `${rect.width * zoom}px ${rect.height * zoom}px`;
        lens.style.backgroundPosition = `${-(x * zoom - lw / 2)}px ${-(y * zoom - lh / 2)}px`;
        zoomLabel.textContent = `${zoom.toFixed(1)}×`;
    }
    const schedule = () => { if (!rafPending) { rafPending = true; requestAnimationFrame(draw); } };

    function showLens() {
        if (isVisible) return;
        isVisible = true;
        lens.style.display = 'block';
        hint.style.opacity = '0';
        schedule();
    }
    function hideLens() {
        isVisible = false;
        lens.style.display = 'none';
        hint.style.opacity = '1';
    }
    function track(point) {
        cursorX = point.clientX;
        cursorY = point.clientY;
        schedule();
    }

    // Mouse: hover to inspect, wheel to change magnification
    target.addEventListener('mouseenter', (e) => { track(e); showLens(); });
    target.addEventListener('mousemove', (e) => { track(e); showLens(); });
    target.addEventListener('mouseleave', hideLens);
    target.addEventListener('wheel', (e) => {
        if (!isVisible) return;
        e.preventDefault();
        zoom = Math.min(6, Math.max(1.5, zoom - Math.sign(e.deltaY) * 0.25));
        schedule();
    }, { passive: false });

    // Touch: press and hold to inspect; a quick swipe still scrolls the page
    let holdTimer = null;
    target.addEventListener('touchstart', (e) => {
        track(e.touches[0]);
        clearTimeout(holdTimer);
        holdTimer = setTimeout(showLens, 220);
    }, { passive: true });
    target.addEventListener('touchmove', (e) => {
        if (!isVisible) { clearTimeout(holdTimer); return; }
        e.preventDefault();
        track(e.touches[0]);
    }, { passive: false });
    const endTouch = () => { clearTimeout(holdTimer); hideLens(); };
    target.addEventListener('touchend', endTouch);
    target.addEventListener('touchcancel', endTouch);
    target.addEventListener('contextmenu', (e) => { if (isVisible) e.preventDefault(); });

    // Solid top bar once the stage is out of view (fixed nav is phone/tablet only)
    new IntersectionObserver(([entry]) => {
        $('top-bar').classList.toggle('solid', !entry.isIntersecting && window.innerWidth < 1024);
    }, { rootMargin: '-72px 0px 0px 0px' }).observe($('stage'));

    // --- 5. SAVE & SHARE ---
    const favBtn = $('fav-btn');

    function renderFav() {
        const saved = Fasarte.isSaved(work);
        favBtn.setAttribute('aria-pressed', String(saved));
        favBtn.setAttribute('aria-label', saved ? 'Remove from saved works' : 'Save this work');
        const icon = favBtn.querySelector('span');
        icon.classList.toggle('fill-icon', saved);
        icon.classList.toggle('text-[#ff6b81]', saved);
    }
    favBtn.addEventListener('click', () => {
        const saved = Fasarte.toggleSaved(work);
        renderFav();
        toast(saved ? `Saved. Find it under the heart${inHall ? ', anywhere in the hall' : ' in the gallery'}` : 'Removed from your saved works');
    });
    renderFav();

    $('share-btn').addEventListener('click', async () => {
        const url = new URL(Fasarte.workUrl(work), location.href).href;
        const data = inHall
            ? { title: `${work.title} | Fasarte`, text: `${work.title}, from ${catalogue.gallery.title} at Fasarte`, url }
            : { title: `${work.title} | ${catalogue.gallery.title}`, text: `${work.title}, from ${catalogue.gallery.title}`, url };
        if (navigator.share) {
            try { await navigator.share(data); } catch {}
            return;
        }
        try {
            await navigator.clipboard.writeText(url);
            toast('Link copied');
        } catch {
            toast('Copy this page\'s address to share it');
        }
    });

    let toastTimer;
    function toast(msg) {
        const el = $('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }
});
</script>

</body>
</html>
