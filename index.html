<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sparkling Eyes | Curated Collection</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
            colors: {
                primary: "#6B8E23", 
                "background-light": "#FAFAF9", 
                "background-dark": "#1C1C1E",
                "text-primary-light": "#262626",
                "text-primary-dark": "#F5F5F5",
                "text-secondary-light": "#525252",
                "text-secondary-dark": "#A3A3A3",
            },
            fontFamily: {
                display: ["Playfair Display", "serif"],
                body: ["Inter", "sans-serif"],
            }
            },
        },
        };
    </script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .masonry-grid {
            column-count: 2;
            column-gap: 24px;
        }
        @media (min-width: 768px) { .masonry-grid { column-count: 3; } }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 48px; 
        }

        .gallery-container:hover .masonry-item {
            opacity: 0.4;
            filter: grayscale(80%);
            transition: all 0.5s ease;
        }
        .gallery-container .masonry-item:hover {
            opacity: 1;
            filter: grayscale(0%);
            transform: scale(1.02);
            z-index: 10;
        }

        /* --- WIDER 3D CYLINDER CAROUSEL STYLES --- */
        .carousel-viewport {
            perspective: 2000px; /* INCREASED: Pulls the "camera" back for the wider radius */
            width: 100%;
            height: 450px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: pan-y;
        }
        @media (min-width: 768px) { .carousel-viewport { height: 550px; } }

        .carousel-scene {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .carousel-card {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 260px;
            height: 300px;
            margin-left: -130px;
            margin-top: -150px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: opacity 0.8s ease; 
        }
        @media (min-width: 768px) {
            .carousel-card { 
                width: 340px; height: 380px;
                margin-left: -170px; margin-top: -190px;
            }
        }

        .carousel-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .carousel-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5); 
            transition: opacity 0.8s ease;
        }
        
        .carousel-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.1);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .carousel-card.active .carousel-overlay { opacity: 0; }
        .carousel-card.active .carousel-content { opacity: 1; pointer-events: auto; }
        .carousel-card.active { cursor: default; }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-primary-light dark:text-text-primary-dark font-body antialiased transition-colors duration-500 selection:bg-primary/30">

    <header class="pt-16 pb-6 px-6 text-center">
        <p class="text-xs font-bold tracking-[0.3em] uppercase text-text-secondary-light dark:text-text-secondary-dark mb-4">Est. 2024 • Handcrafted</p>
        <h1 class="font-display text-5xl md:text-6xl font-medium italic mb-4">Orneril</h1>
        <p class="font-light text-sm max-w-xs mx-auto text-text-secondary-light dark:text-text-secondary-dark leading-relaxed">
            A digital exhibition of beadwork, exploring texture, light, and the patience of hand-crafting.
        </p>
    </header>

    <section class="relative w-full py-10 overflow-hidden bg-background-light dark:bg-background-dark">
        <div class="carousel-viewport" id="carousel-viewport">
            <div class="carousel-scene" id="carousel-scene"></div>
        </div>

        <div class="flex justify-center items-center gap-6 mt-6 relative z-20">
            <button id="btn-prev" class="w-12 h-12 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 flex items-center justify-center hover:bg-primary hover:text-white transition-all transform active:scale-90">
                <span class="material-symbols-outlined text-[24px]">chevron_left</span>
            </button>
            <button id="btn-next" class="w-12 h-12 rounded-full bg-gray-900 dark:bg-white text-white dark:text-gray-900 flex items-center justify-center hover:bg-primary dark:hover:bg-primary transition-all transform active:scale-90 shadow-lg">
                <span class="material-symbols-outlined text-[24px]">chevron_right</span>
            </button>
        </div>
    </section>

    <nav class="sticky top-0 z-40 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-b border-gray-100 dark:border-gray-800 mt-12 mb-12">
        <div class="flex justify-center overflow-x-auto no-scrollbar py-4 space-x-8 px-6">
            <button class="text-xs font-bold uppercase tracking-widest border-b border-primary text-primary pb-1">All Works</button>
            <button class="text-xs font-bold uppercase tracking-widest text-text-secondary-dark hover:text-primary transition-colors pb-1">Chains</button>
            <button class="text-xs font-bold uppercase tracking-widest text-text-secondary-dark hover:text-primary transition-colors pb-1">Bracelets</button>
            <button class="text-xs font-bold uppercase tracking-widest text-text-secondary-dark hover:text-primary transition-colors pb-1">Archive</button>
        </div>
    </nav>

    <main class="px-6 pb-40 max-w-5xl mx-auto">
        <div class="masonry-grid gallery-container">
            <div class="masonry-item">
                <a href="#" class="block group craft-link">
                    <div class="relative overflow-hidden mb-4 rounded-xl">
                        <img alt="Elegant beaded eyeglass chain" class="w-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-700" src="https://images.unsplash.com/photo-1611085583191-a3b181a88401?q=80&w=800&auto=format&fit=crop"/>
                    </div>
                    <div class="text-center">
                        <h3 class="font-display text-xl italic text-text-primary-light dark:text-text-primary-dark mb-1">Verdant Eye Chain</h3>
                        <p class="text-[10px] uppercase tracking-widest text-text-secondary-dark">Chain • No. 04</p>
                    </div>
                </a>
            </div>
            <div class="masonry-item">
                <a href="#" class="block group craft-link">
                    <div class="relative overflow-hidden mb-4 rounded-xl">
                        <img alt="Colorful bead bracelet stack" class="w-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-700" src="https://images.unsplash.com/photo-1573408301185-9146fe634ad0?q=80&w=800&auto=format&fit=crop"/>
                    </div>
                    <div class="text-center">
                        <h3 class="font-display text-xl italic text-text-primary-light dark:text-text-primary-dark mb-1">Boho Stack</h3>
                        <p class="text-[10px] uppercase tracking-widest text-text-secondary-dark">Set • No. 08</p>
                    </div>
                </a>
            </div>
            <div class="masonry-item">
                <a href="#" class="block group craft-link">
                    <div class="relative overflow-hidden mb-4 rounded-xl">
                        <img alt="Close up of yellow and green beadwork" class="w-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-700" src="https://images.unsplash.com/photo-1602173574767-37ac01994b2a?q=80&w=800&auto=format&fit=crop"/>
                    </div>
                    <div class="text-center">
                        <h3 class="font-display text-xl italic text-text-primary-light dark:text-text-primary-dark mb-1">Lemon Lime</h3>
                        <p class="text-[10px] uppercase tracking-widest text-text-secondary-dark">Necklace • No. 12</p>
                    </div>
                </a>
            </div>
             <div class="masonry-item">
                <a href="#" class="block group craft-link">
                    <div class="relative overflow-hidden mb-4 rounded-xl">
                        <img alt="Minimalist pearl necklace" class="w-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-700" src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=800&auto=format&fit=crop"/>
                    </div>
                    <div class="text-center">
                        <h3 class="font-display text-xl italic text-text-primary-light dark:text-text-primary-dark mb-1">Ocean Whisper</h3>
                        <p class="text-[10px] uppercase tracking-widest text-text-secondary-dark">Pearl • No. 02</p>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-8 left-0 right-0 flex justify-center z-50 pointer-events-none">
        <div class="bg-white/20 dark:bg-[#1C1C1E]/60 backdrop-blur-xl backdrop-saturate-150 border border-gray/80 dark:border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.08)] rounded-full px-8 py-3.5 flex items-center gap-8 pointer-events-auto transition-all duration-300 hover:scale-105">
            
            <button class="text-gray-700 dark:text-gray-300 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-[22px]">grid_view</span>
            </button>
            
            <div class="w-[1px] h-5 bg-gray-300/80 dark:bg-gray-700/80"></div>
            
            <button class="text-gray-700 dark:text-gray-300 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-[22px]">search</span>
            </button>
            
            <div class="w-[1px] h-5 bg-gray-300/80 dark:bg-gray-700/80"></div>
            
            <button class="text-gray-700 dark:text-gray-300 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-[22px]">person</span>
            </button>
            
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const carouselData = [
                { title: 'Verdant Eye', type: 'Chain', img: 'https://images.unsplash.com/photo-1611085583191-a3b181a88401?q=80&w=800&auto=format&fit=crop' },
                { title: 'Boho Stack', type: 'Set', img: 'https://images.unsplash.com/photo-1573408301185-9146fe634ad0?q=80&w=800&auto=format&fit=crop' },
                { title: 'Lemon Lime', type: 'Necklace', img: 'https://images.unsplash.com/photo-1602173574767-37ac01994b2a?q=80&w=800&auto=format&fit=crop' },
                { title: 'Ocean Whisper', type: 'Pearl', img: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=800&auto=format&fit=crop' },
                { title: 'Golden Hour', type: 'Layered', img: 'https://images.unsplash.com/photo-1588444650733-d0767b753fc8?q=80&w=800&auto=format&fit=crop' }
            ];

            const scene = document.getElementById('carousel-scene');
            const totalCards = carouselData.length;
            let activeIndex = 0; 
            let cards = [];

            const theta = 360 / totalCards; 
            
            carouselData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'carousel-card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <div class="carousel-overlay"></div>
                    <div class="carousel-content">
                        <h2 class="text-white font-display text-4xl italic mb-4 drop-shadow-lg text-center">${item.title}</h2>
                        <button class="view-btn bg-white/90 text-black px-6 py-2.5 rounded-full text-sm font-medium hover:bg-white hover:scale-105 transition-all shadow-xl backdrop-blur-md">
                            View Project
                        </button>
                    </div>
                `;
                
                card.addEventListener('click', (e) => {
                    const currentFrontIndex = ((activeIndex % totalCards) + totalCards) % totalCards;
                    
                    if (index !== currentFrontIndex) {
                        let offset = index - currentFrontIndex;
                        if (offset > Math.floor(totalCards / 2)) offset -= totalCards;
                        if (offset < -Math.floor(totalCards / 2)) offset += totalCards;
                        
                        activeIndex += offset;
                        updateCarousel();
                    } else if (e.target.closest('.view-btn')) {
                        navigateToSingleView(item.img, item.title, item.type);
                    }
                });

                scene.appendChild(card);
                cards.push(card);
            });

            function updateCarousel() {
                const isMobile = window.innerWidth < 768;
                const cardWidth = isMobile ? 260 : 340;
                
                // --- INCREASED SPACING ---
                // We add a significantly larger number here (140 on mobile, 300 on desktop) 
                // to push the cards much further out from the center axis.
                const spacingPadding = isMobile ? 180 : 380; 
                const radius = Math.round((cardWidth / 2) / Math.tan(Math.PI / totalCards)) + spacingPadding;

                const currentFrontIndex = ((activeIndex % totalCards) + totalCards) % totalCards;

                cards.forEach((card, i) => {
                    const angle = i * theta;
                    card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

                    let offset = i - currentFrontIndex;
                    if (offset > Math.floor(totalCards / 2)) offset -= totalCards;
                    if (offset < -Math.floor(totalCards / 2)) offset += totalCards;

                    const absOffset = Math.abs(offset);
                    if (absOffset === 0) {
                        card.classList.add('active');
                        card.style.opacity = 1;
                    } else {
                        card.classList.remove('active');
                        card.style.opacity = 1 - (absOffset * 0.25); // Slightly smoother fade given the larger radius
                    }
                });

                // Pull the scene back exactly by the new, larger radius
                const sceneAngle = activeIndex * -theta;
                scene.style.transform = `translateZ(${-radius}px) rotateY(${sceneAngle}deg)`;
            }

            document.getElementById('btn-prev').addEventListener('click', () => {
                activeIndex--;
                updateCarousel();
            });

            document.getElementById('btn-next').addEventListener('click', () => {
                activeIndex++;
                updateCarousel();
            });

            let startX = 0;
            let isDragging = false;
            const viewport = document.getElementById('carousel-viewport');

            viewport.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                isDragging = true;
            }, { passive: true });

            viewport.addEventListener('touchend', (e) => {
                if (!isDragging) return;
                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;

                if (Math.abs(diff) > 40) {
                    if (diff > 0) activeIndex++; 
                    else activeIndex--; 
                    updateCarousel();
                }
                isDragging = false;
            });

            window.addEventListener('resize', updateCarousel);
            updateCarousel(); 

            function navigateToSingleView(imgSrc, title, type) {
                const params = new URLSearchParams({ src: imgSrc, title: title, type: type });
                window.location.href = `single_craft_view.html?${params.toString()}`;
            }

            const gridLinks = document.querySelectorAll('.craft-link');
            gridLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault(); 
                    const imgSrc = link.querySelector('img').src;
                    const title = link.querySelector('h3').innerText;
                    const rawType = link.querySelector('p').innerText; 
                    const type = rawType.split(' •')[0];
                    navigateToSingleView(imgSrc, title, type);
                });
            });
        });
    </script>
</body>
</html>
