<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Artestoa</title>
    <meta name="description" content="A maker's gallery in Artestoa, a hall of handcraft."/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <script>
        tailwind.config = {
        darkMode: "media",
        theme: {
            extend: {
            colors: {
                // Each gallery's accent (catalogue theme) arrives as --accent
                primary: "rgb(var(--accent) / <alpha-value>)",
                "background-light": "#F4F1EA",
                "background-dark": "#141413",
                "text-primary-light": "#262626",
                "text-primary-dark": "#F5F5F5",
                "text-secondary-light": "#5C5A55",
                "text-secondary-dark": "#A3A3A3",
            },
            fontFamily: {
                display: ["Playfair Display", "serif"],
                body: ["Inter", "sans-serif"],
            }
            },
        },
        };
    </script>

    <style>
        @view-transition { navigation: auto; }
        ::view-transition-group(artwork) { animation-duration: 0.55s; animation-timing-function: cubic-bezier(0.25, 1, 0.5, 1); }

        :root {
            --wall: #F4F1EA;
            --wall-shade: #E9E4D9;
            --frame: #1d1b18;
            --mat: #FBFAF7;
            --ink: #262626;
            --muted: #5C5A55;
            --accent: 107 142 35;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --wall: #141413;
                --wall-shade: #1d1c1a;
                --frame: #050505;
                --mat: #ECE8DF;
                --ink: #F5F5F5;
                --muted: #A3A3A3;
            }
        }

        html { scroll-behavior: smooth; scroll-padding-top: 72px; }
        body { background: var(--wall); overflow-x: clip; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300; }
        .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 400; }

        /* ---------- Entrance ---------- */
        .entrance-rule { width: 1px; height: 56px; background: currentColor; opacity: .25; margin: 0 auto; }
        @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
        .drift { animation: drift 2.4s ease-in-out infinite; }

        /* ---------- 3D cylinder carousel ---------- */
        .carousel-viewport {
            perspective: 2000px;
            width: 100%;
            height: 350px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: pan-y;
            cursor: grab;
        }
        .carousel-viewport.dragging { cursor: grabbing; }
        @media (min-width: 768px) { .carousel-viewport { height: 460px; } }

        .carousel-scene {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .carousel-card {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 240px;
            height: 320px;
            margin-left: -120px;
            margin-top: -160px;
            border-radius: 4px;
            overflow: hidden;
            background: var(--frame);
            padding: 10px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: opacity 0.8s ease;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        @media (min-width: 768px) {
            .carousel-card {
                width: 300px; height: 400px;
                margin-left: -150px; margin-top: -200px;
            }
        }
        .carousel-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
        }
        .carousel-overlay {
            position: absolute;
            inset: 10px;
            background: rgba(0,0,0,0.45);
            transition: opacity 0.8s ease;
        }
        .carousel-content {
            position: absolute;
            inset: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 28px;
            background: linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,0) 55%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .carousel-card.active .carousel-overlay { opacity: 0; }
        .carousel-card.active .carousel-content { opacity: 1; pointer-events: auto; }
        .carousel-card.active { cursor: default; }

        /* ---------- Room navigation ---------- */
        #room-nav { background: color-mix(in srgb, var(--wall) 92%, transparent); }
        .room-link { color: var(--muted); border-bottom: 1px solid transparent; }
        /* On narrow screens the room list scrolls sideways; fade its edges to say so */
        @media (max-width: 767px) {
            #room-links { mask-image: linear-gradient(to right, transparent, #000 20px, #000 calc(100% - 48px), transparent); }
        }
        .room-link:hover { color: rgb(var(--accent)); }
        .room-link.active { color: rgb(var(--accent)); border-color: rgb(var(--accent)); }

        /* ---------- Rooms & framed works ---------- */
        .room { position: relative; }
        /* A soft wash of light falls across the top of each room's wall */
        .room::before {
            content: "";
            position: absolute;
            /* Exactly viewport-wide and centred: anything wider makes phones widen the
               whole layout (body's overflow clip doesn't stop that on mobile browsers) */
            top: 0;
            bottom: 0;
            left: 50%;
            width: 100vw;
            transform: translateX(-50%);
            /* Light pours down from above: fade it in so the room's top edge never shows */
            -webkit-mask-image: linear-gradient(to bottom, transparent, #000 160px);
            mask-image: linear-gradient(to bottom, transparent, #000 160px);
            background: radial-gradient(70% 45% at 50% 120px, rgba(255, 248, 225, .55), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
        @media (prefers-color-scheme: dark) {
            .room::before { background: radial-gradient(70% 45% at 50% 120px, rgba(255, 240, 200, .06), transparent 70%); }
        }

        .wall {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 40px 20px;
            align-items: start;
        }
        @media (min-width: 768px) {
            .wall { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 64px 44px; }
            /* Salon hang: the middle column sits lower, so the wall breathes */
            .wall > .work:nth-child(3n+2) { margin-top: 72px; }
        }
        @media (max-width: 767px) {
            .wall > .work:nth-child(2n) { margin-top: 40px; }
        }

        .work {
            opacity: 0;
            transform: perspective(1000px) rotateY(-18deg) translateY(30px);
            transition: opacity .9s ease, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            transition-delay: var(--d, 0s);
        }
        .work.in-view { opacity: 1; transform: none; }

        .frame {
            position: relative;
            display: block;
            background: var(--frame);
            padding: 7px;
            box-shadow:
                0 1px 0 rgba(255,255,255,.06) inset,
                0 2px 4px rgba(0,0,0,.12),
                0 22px 40px -18px rgba(0,0,0,.45);
            transition: transform .6s cubic-bezier(0.25, 1, 0.5, 1), box-shadow .6s ease;
        }
        .frame .mat {
            background: var(--mat);
            padding: 9%;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.06), inset 0 4px 10px rgba(0,0,0,.08);
        }
        .frame img {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
        }
        /* Gallery spotlight that follows the pointer across the glass */
        .frame::after {
            content: "";
            position: absolute;
            inset: 7px;
            background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 30%), rgba(255,255,255,.22), transparent 60%);
            opacity: 0;
            transition: opacity .4s ease;
            pointer-events: none;
        }
        .work a:hover .frame, .work a:focus-visible .frame {
            transform: translateY(-6px);
            box-shadow:
                0 2px 4px rgba(0,0,0,.12),
                0 40px 60px -22px rgba(0,0,0,.55);
        }
        .work a:hover .frame::after { opacity: 1; }
        .work a:focus-visible { outline: none; }
        .work a:focus-visible .frame { outline: 2px solid rgb(var(--accent)); outline-offset: 6px; }

        /* Dim the rest of the wall to focus on the hovered work */
        @media (hover: hover) {
            /* Opacity only: it stays on the compositor, unlike filter: grayscale() */
            .wall:has(.work a:hover) .work:not(:hover) { opacity: .45; }
            .work.in-view { transition: opacity .5s ease, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.1); }
        }

        .placard {
            margin-top: 18px;
            padding-left: 12px;
            border-left: 1px solid color-mix(in srgb, var(--ink) 20%, transparent);
        }
        .work.just-visited .frame { outline: 1px solid rgb(var(--accent)); outline-offset: 8px; }

        .heart-badge {
            position: absolute; top: 14px; right: 14px;
            width: 28px; height: 28px; border-radius: 999px;
            display: none; align-items: center; justify-content: center;
            background: rgba(255,255,255,.85); color: #c2334d;
            box-shadow: 0 4px 10px rgba(0,0,0,.15);
        }
        .work.is-fav .heart-badge { display: flex; }

        /* ---------- The Artist ---------- */
        .material-chip {
            border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
            transition: border-color .3s ease, color .3s ease;
        }
        .material-chip:hover { border-color: rgb(var(--accent)); color: rgb(var(--accent)); }
        .artist-work img { transition: transform .6s cubic-bezier(0.25, 1, 0.5, 1); }
        .artist-work:hover img { transform: scale(1.04); }

        /* While the page is moving, frames sliding under a still pointer shouldn't
           trigger hover effects (each one restyles the wall and swaps the ambient light) */
        .is-scrolling #rooms { pointer-events: none; }

        /* ---------- Ambient light ----------
           Two stacked layers crossfade. Each is painted with soft radial gradients in the
           work's colours (glowFor in core/artestoa.js), so no CSS blur is ever computed. */
        .ambient-layer {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity .9s ease;
            will-change: opacity;
        }
        .ambient-layer.on { opacity: 1; }

        /* ---------- Arriving through a portal in the hall ----------
           The page waits behind the wormhole, then eases in as the tunnel opens out */
        html.arriving body > :not(#wormhole) { opacity: 0; transform: scale(1.04); }
        html.landing body > :not(#wormhole) {
            transition: opacity .9s ease, transform 1.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ---------- Overlay sheet (search / saved / about) ---------- */
        #sheet[hidden] { display: none; }
        #sheet .panel { animation: sheetUp .45s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .work { opacity: 1; transform: none; transition: none; }
            .carousel-scene { transition: none; }
            .drift { animation: none; }
        }
    </style>
    <script>
        // A page transition the browser skips (e.g. the tab is in the background) rejects
        // its promises; that's expected, so keep it out of the console
        addEventListener('pageswap', (e) => e.viewTransition?.ready.catch(() => {}));
        addEventListener('pagereveal', (e) => e.viewTransition?.ready.catch(() => {}));

        // Arriving through a portal: hold the page back (before its first paint) for the wormhole
        try {
            const arrival = JSON.parse(sessionStorage.getItem('artestoa:arrival'));
            sessionStorage.removeItem('artestoa:arrival');
            if (arrival?.palette && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
                window.artestoaArrival = arrival;
                document.documentElement.classList.add('arriving');
            }
        } catch {}
    </script>
</head>

<body class="text-text-primary-light dark:text-text-primary-dark font-body antialiased selection:bg-primary/30">

    <div id="ambient-bg" class="fixed inset-0 -z-10 pointer-events-none transition-opacity duration-[1200ms] ease-out opacity-0 overflow-hidden" style="transform: translate3d(0,0,0);">
        <div class="ambient-layer"></div>
        <div class="ambient-layer"></div>
        <div class="absolute inset-0 bg-background-light/30 dark:bg-background-dark/40"></div>
    </div>

    <!-- ===== Entrance ===== -->
    <!-- Stepping in from the hall: the far end of the wormhole, then the gallery eases in -->
    <script src="/core/wormhole.js"></script>
    <script>
        if (window.artestoaArrival) {
            const root = document.documentElement;
            const land = () => {
                if (!root.classList.contains('arriving')) return;
                root.classList.add('landing');
                root.classList.remove('arriving');
                setTimeout(() => root.classList.remove('landing'), 1500);
            };
            Wormhole.run({ palette: window.artestoaArrival.palette, direction: 'out', duration: 1150, onReveal: land });
            // Never leave the page hidden, even if animation frames are held back
            setTimeout(() => { land(); Wormhole.clear(); }, 2500);
        }
    </script>

    <!-- The hall this gallery opens off -->
    <a id="hall-crumb" href="/" class="absolute top-5 left-5 md:top-6 md:left-8 z-30 inline-flex items-center gap-2 text-[11px] uppercase tracking-[0.25em] text-text-secondary-light dark:text-text-secondary-dark hover:text-primary transition-colors">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        <span><span class="font-display normal-case italic tracking-normal text-[15px]">arte·stoa</span><span id="wing-crumb" class="hidden sm:inline"></span></span>
    </a>

    <header class="pt-20 md:pt-24 pb-8 px-6 text-center">
        <p id="gallery-kicker" class="text-[11px] font-semibold tracking-[0.35em] uppercase text-text-secondary-light dark:text-text-secondary-dark mb-6"></p>
        <h1 id="gallery-title" class="font-display text-6xl md:text-8xl font-medium italic mb-5 tracking-tight"></h1>
        <p id="gallery-intro" class="font-light text-sm md:text-base max-w-md mx-auto text-text-secondary-light dark:text-text-secondary-dark leading-relaxed"></p>
        <p id="exhibit-stats" class="mt-6 text-[11px] uppercase tracking-[0.25em] text-text-secondary-light dark:text-text-secondary-dark"></p>
        <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
            <a id="tour-link" href="#" class="inline-flex items-center gap-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-6 py-3 rounded-full text-sm font-medium hover:bg-primary dark:hover:bg-primary dark:hover:text-white transition-colors shadow-lg">
                Begin the guided tour
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </a>
            <a href="#rooms" class="inline-flex items-center gap-2 px-6 py-3 rounded-full text-sm font-medium border border-black/15 dark:border-white/20 hover:border-primary hover:text-primary transition-colors">
                Wander the rooms
            </a>
        </div>
        <a href="#room-artist" class="mt-6 inline-flex items-center gap-1.5 text-[11px] uppercase tracking-[0.25em] text-text-secondary-light dark:text-text-secondary-dark hover:text-primary transition-colors">
            Meet the artist
            <span class="material-symbols-outlined text-[16px]">south</span>
        </a>
    </header>

    <!-- ===== In the Spotlight (carousel) ===== -->
    <section class="relative w-full pt-6 pb-4 overflow-hidden" aria-label="In the spotlight">
        <p class="text-center text-[11px] font-semibold tracking-[0.35em] uppercase text-text-secondary-light dark:text-text-secondary-dark">In the Spotlight</p>
        <div class="carousel-viewport" id="carousel-viewport" tabindex="0" aria-roledescription="carousel" aria-label="Featured works. Use the arrow keys to rotate.">
            <div class="carousel-scene" id="carousel-scene"></div>
        </div>

        <div class="flex justify-center items-center gap-6 mt-2 relative z-20">
            <button id="btn-prev" aria-label="Previous featured work" class="w-12 h-12 rounded-full bg-black/5 dark:bg-white/10 text-gray-700 dark:text-gray-200 flex items-center justify-center hover:bg-primary hover:text-white transition-all transform active:scale-90">
                <span class="material-symbols-outlined text-[24px]">chevron_left</span>
            </button>
            <p id="carousel-caption" class="min-w-[9rem] text-center text-[11px] uppercase tracking-[0.25em] text-text-secondary-light dark:text-text-secondary-dark" aria-live="polite"></p>
            <button id="btn-next" aria-label="Next featured work" class="w-12 h-12 rounded-full bg-gray-900 dark:bg-white text-white dark:text-gray-900 flex items-center justify-center hover:bg-primary dark:hover:bg-primary dark:hover:text-white transition-all transform active:scale-90 shadow-lg">
                <span class="material-symbols-outlined text-[24px]">chevron_right</span>

        </div>

        <div class="mt-14 flex flex-col items-center text-text-secondary-light dark:text-text-secondary-dark">
            <span class="entrance-rule"></span>
            <a href="#rooms" class="drift mt-3 text-[11px] uppercase tracking-[0.3em] hover:text-primary transition-colors">Enter the gallery</a>
        </div>
    </section>

    <!-- ===== Room navigation ===== -->
    <nav id="room-nav" class="sticky top-0 z-40 mt-12 backdrop-blur-sm border-b border-black/5 dark:border-white/5" aria-label="Rooms">
        <div class="flex md:justify-center overflow-x-auto no-scrollbar py-4 gap-8 px-6" id="room-links"></div>
    </nav>

    <main id="rooms" class="px-5 md:px-6 pb-24 max-w-5xl mx-auto"></main>

    <!-- ===== The Artist ===== -->
    <section id="room-artist" class="room px-5 md:px-6 pt-24 md:pt-32 pb-40 max-w-5xl mx-auto" aria-labelledby="artist-name">
        <header class="mb-14 md:mb-20">
            <p class="text-[11px] font-semibold tracking-[0.35em] uppercase text-primary mb-3">The Last Room</p>
            <p class="font-display text-4xl md:text-5xl italic leading-none">Meet the Artist</p>
        </header>

        <div class="grid md:grid-cols-[minmax(0,5fr),minmax(0,7fr)] gap-12 md:gap-20 items-start">
            <figure class="work artist-portrait max-w-sm mx-auto md:mx-0 w-full">
                <div class="frame">
                    <div class="mat">
                        <div id="artist-portrait" class="aspect-[3/4] w-full overflow-hidden"></div>
                    </div>
                </div>
                <figcaption class="placard">
                    <p id="artist-plaque-name" class="font-display text-lg italic leading-snug"></p>
                    <p id="artist-plaque-meta" class="mt-1 text-[10px] uppercase tracking-[0.18em] text-text-secondary-light dark:text-text-secondary-dark font-semibold"></p>
                </figcaption>
            </figure>

            <div class="work" style="--d:.12s">
                <h2 id="artist-name" class="font-display text-5xl md:text-6xl italic leading-[1.05] mb-3"></h2>
                <p id="artist-role" class="text-[11px] uppercase tracking-[0.25em] text-text-secondary-light dark:text-text-secondary-dark mb-10"></p>

                <blockquote id="artist-quote" hidden class="font-display text-2xl md:text-3xl italic leading-snug mb-10 pl-6 border-l-2 border-primary"></blockquote>

                <div id="artist-bio" class="space-y-5 font-light text-base md:text-lg leading-relaxed text-text-secondary-light dark:text-text-secondary-dark"></div>

                <dl id="artist-facts" class="grid grid-cols-3 gap-4 py-6 mt-10 border-t border-b border-black/10 dark:border-white/10"></dl>

                <div class="mt-10">
                    <p class="text-[10px] uppercase tracking-[0.25em] font-semibold mb-4">Signature materials</p>
                    <div id="artist-materials" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="artist-links" class="mt-10 flex flex-wrap gap-3 empty:hidden"></div>
            </div>
        </div>

        <div class="mt-20 md:mt-28">
            <p class="text-[10px] uppercase tracking-[0.25em] font-semibold mb-6 text-center md:text-left">Selected works</p>
            <div id="artist-works" class="grid grid-cols-3 md:grid-cols-6 gap-4 md:gap-6"></div>
        </div>
    </section>

    <!-- ===== Exit ===== -->
    <section id="about" class="px-6 pb-48 max-w-2xl mx-auto text-center">
        <span class="entrance-rule mb-10 block"></span>
        <p class="text-[11px] font-semibold tracking-[0.35em] uppercase text-text-secondary-light dark:text-text-secondary-dark mb-4">Exit</p>
        <h2 class="font-display text-4xl italic mb-6">Thank you for visiting</h2>
        <p id="gallery-exit" class="font-light leading-relaxed text-text-secondary-light dark:text-text-secondary-dark"></p>
        <p id="saved-summary" class="mt-8 text-sm text-text-secondary-light dark:text-text-secondary-dark"></p>
        <div class="mt-12 flex flex-wrap items-center justify-center gap-3">
            <a id="exit-hall" href="/" class="inline-flex items-center gap-2 bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-6 py-3 rounded-full text-sm font-medium hover:bg-primary dark:hover:bg-primary dark:hover:text-white transition-colors shadow-lg">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Back to the hall
            </a>
            <a id="exit-next" href="/" class="inline-flex items-center gap-2 px-6 py-3 rounded-full text-sm font-medium border border-black/15 dark:border-white/20 hover:border-primary hover:text-primary transition-colors"></a>
        </div>
    </section>

    <!-- ===== Dock ===== -->
    <footer class="fixed bottom-8 left-0 right-0 flex justify-center z-50 pointer-events-none">
        <div class="bg-white/60 dark:bg-[#1C1C1E]/75 backdrop-blur-md border border-black/10 dark:border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.12)] rounded-full px-7 py-3.5 flex items-center gap-6 pointer-events-auto transition-transform duration-300 hover:scale-105">
            <button data-dock="rooms" aria-label="Jump to the rooms" class="text-gray-700 dark:text-gray-300 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-[22px]">grid_view</span>
            </button>
            <div class="w-[1px] h-5 bg-black/15 dark:bg-white/15"></div>
            <button data-dock="search" aria-label="Search the collection" class="text-gray-700 dark:text-gray-300 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-[22px]">search</span>
            </button>
            <div class="w-[1px] h-5 bg-black/15 dark:bg-white/15"></div>
            <button data-dock="saved" aria-label="Your saved works" class="relative text-gray-700 dark:text-gray-300 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-[22px]">favorite</span>
                <span id="saved-count" class="hidden absolute -top-1.5 -right-2.5 min-w-[18px] h-[18px] px-1 rounded-full bg-primary text-white text-[10px] font-semibold leading-[18px] text-center"></span>
            </button>
            <div class="w-[1px] h-5 bg-black/15 dark:bg-white/15"></div>
            <button data-dock="artist" aria-label="Meet the artist" class="text-gray-700 dark:text-gray-300 hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-[22px]">person</span>
            </button>
        </div>
    </footer>

    <!-- ===== Overlay sheet ===== -->
    <div id="sheet" class="fixed inset-0 z-[60]" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div data-close class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <div class="panel absolute left-1/2 -translate-x-1/2 bottom-0 md:bottom-auto md:top-[12vh] w-full md:w-[560px] max-h-[80vh] flex flex-col bg-background-light dark:bg-[#1C1C1E] rounded-t-3xl md:rounded-3xl shadow-2xl">
            <div class="flex items-center justify-between px-6 pt-5 pb-3">
                <h2 id="sheet-title" class="font-display text-2xl italic"></h2>
                <button data-close aria-label="Close" class="w-9 h-9 rounded-full hover:bg-black/5 dark:hover:bg-white/10 flex items-center justify-center">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="search-wrap" class="px-6 pb-3">
                <input id="search-input" type="search" autocomplete="off" placeholder="Search by name, stone, colour, room…" class="w-full rounded-xl border-black/10 dark:border-white/10 bg-white dark:bg-black/30 focus:border-primary focus:ring-primary text-sm"/>
            </div>
            <ul id="sheet-list" class="overflow-y-auto px-3 pb-6"></ul>
        </div>
    </div>

    <script src="/artists/registry.js"></script>
    <script src="/core/artestoa.js"></script>
    <script>
        // Coming back from a work: let the browser morph its image back into its frame
        window.addEventListener('pagereveal', (e) => {
            if (!e.viewTransition || !location.hash.startsWith('#w-')) return;
            const img = document.querySelector(`${CSS.escape(location.hash)} img`);
            if (!img) return;
            img.style.viewTransitionName = 'artwork';
            e.viewTransition.finished.finally(() => (img.style.viewTransitionName = ''));
        });

        // This page shows one maker's gallery: gallery.html?a=<slug>
        Artestoa.currentCatalogue().then((catalogue) => {

            const myGalleryData = catalogue.works;
            const galleryRooms = catalogue.rooms;
            const findWork = catalogue.find;
            const artist = catalogue.artist;
            const { glowFor, escapeHtml } = Artestoa;
            const detailUrl = Artestoa.workUrl;
            const roomOf = (work) => galleryRooms.find((r) => r.id === work.room);
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // --- The gallery's own words, colours and place in the hall ---
            const gallery = catalogue.gallery;
            Artestoa.applyTheme(catalogue.theme);
            document.title = `${gallery.title} | Artestoa`;
            document.getElementById('gallery-kicker').textContent = gallery.kicker;
            document.getElementById('gallery-title').textContent = gallery.title;
            document.getElementById('gallery-intro').textContent = gallery.intro;
            document.getElementById('gallery-exit').textContent = gallery.exit;

            const wing = artestoa.wings.find((w) => w.id === catalogue.entry.wing);
            document.getElementById('hall-crumb').href = Artestoa.hallUrl(catalogue.slug);
            document.getElementById('exit-hall').href = Artestoa.hallUrl(catalogue.slug);
            if (wing) document.getElementById('wing-crumb').textContent = ` › ${wing.title} wing`;
            // "Next door" is the next maker along the hall, or the first open wall after this one
            const neighbours = artestoa.artists;
            const nextDoor = neighbours[neighbours.indexOf(catalogue.entry) + 1];
            const exitNext = document.getElementById('exit-next');
            if (nextDoor) {
                exitNext.href = Artestoa.galleryUrl(nextDoor.slug);
                exitNext.textContent = `Next door: ${nextDoor.name} →`;
            } else {
                exitNext.href = `${Artestoa.hallUrl()}#exhibit`;
                exitNext.textContent = 'Next door: an empty wall. Exhibit here →';
            }

            // A detached gallery stands on its own, with no way back into the hall
            if (Artestoa.isDetached(catalogue.slug)) {
                ['hall-crumb', 'exit-hall', 'exit-next'].forEach((id) => document.getElementById(id).remove());
            }

            // --- Entrance details ---
            const tourSkips = gallery.tourSkips || [];
            const named = myGalleryData.filter((w) => !tourSkips.includes(w.room));
            const photoCount = myGalleryData.reduce((n, w) => n + w.images.length, 0);
            document.getElementById('exhibit-stats').textContent =
                `${myGalleryData.length} works · ${photoCount} photographs · ${galleryRooms.length} rooms`;
            document.getElementById('tour-link').href = detailUrl(named[0], { tour: 1 });

            // --- Ambient light: tints the whole gallery with the work in focus ---
            const ambientBg = document.getElementById('ambient-bg');
            const ambientLayers = ambientBg.querySelectorAll('.ambient-layer');
            let ambientKey = null;
            let ambientFront = 0;
            let ambientTimer = null;
            let carouselAmbient = null;
            let carouselInView = true;

            // Repainting the backdrop is the most expensive thing on this page, so:
            //  - it is skipped entirely when the image hasn't changed,
            //  - it runs off the critical animation frame (a short timeout), and
            //  - rapid requests (autoplay, fast hovers) coalesce into the last one.
            // `at` is where the light comes from, in % of the viewport (defaults to centre)
            function setAmbient(work, delay = 50, at = [50, 50]) {
                clearTimeout(ambientTimer);
                ambientTimer = setTimeout(() => {
                    if (!work) { ambientBg.style.opacity = '0'; return; }
                    ambientBg.style.opacity = '1';
                    const key = `${work.id}@${at}`;
                    if (key === ambientKey) return;
                    ambientKey = key;
                    ambientFront ^= 1;
                    ambientLayers[ambientFront].style.backgroundImage = glowFor(work, { at });
                    ambientLayers[ambientFront].classList.add('on');
                    ambientLayers[ambientFront ^ 1].classList.remove('on');
                }, delay);
            }
            // On touch screens, the work currently centred on screen ({ work, at }), if any
            let centredWork = null;
            // What the room should be lit by when nothing is being hovered
            const restoreAmbient = (delay) => {
                if (carouselInView) setAmbient(carouselAmbient, delay);
                else if (centredWork) setAmbient(centredWork.work, delay, centredWork.at);
                else setAmbient(null, delay);
            };

            // ============ 1. 3D CYLINDER CAROUSEL ============
            const carouselData = myGalleryData.filter((w) => w.featured);
            const scene = document.getElementById('carousel-scene');
            const viewport = document.getElementById('carousel-viewport');
            const caption = document.getElementById('carousel-caption');
            const totalCards = carouselData.length;
            const theta = 360 / totalCards;
            let activeIndex = 0;
            const cards = [];

            const wrapOffset = (offset) => {
                if (offset > Math.floor(totalCards / 2)) offset -= totalCards;
                if (offset < -Math.floor(totalCards / 2)) offset += totalCards;
                return offset;
            };
            const frontIndex = () => ((activeIndex % totalCards) + totalCards) % totalCards;

            carouselData.forEach((work, index) => {
                const card = document.createElement('div');
                card.className = 'carousel-card';
                card.innerHTML = `
                    <img src="${work.images[0].sm}" alt="${escapeHtml(work.title)}" draggable="false">
                    <div class="carousel-overlay"></div>
                    <div class="carousel-content">
                        <p class="text-white/70 text-[10px] uppercase tracking-[0.3em] mb-2">${escapeHtml(roomOf(work).title)} · ${work.year}</p>
                        <h2 class="text-white font-display text-3xl md:text-4xl italic mb-4 [text-shadow:0_2px_12px_rgba(0,0,0,.45)] text-center px-4">${escapeHtml(work.title)}</h2>
                        <a href="${detailUrl(work)}" class="view-btn bg-white/90 text-black px-6 py-2.5 rounded-full text-sm font-medium hover:bg-white hover:scale-105 transition-transform shadow-xl">
                            View Work
                        </a>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if (dragMoved) { e.preventDefault(); return; }
                    if (index !== frontIndex()) {
                        e.preventDefault();
                        activeIndex += wrapOffset(index - frontIndex());
                        updateCarousel();
                    } else if (e.target.closest('.view-btn')) {
                        e.preventDefault();
                        goToWork(work, card.querySelector('img'));
                    }
                });

                scene.appendChild(card);
                cards.push(card);
            });

            function updateCarousel() {
                const isMobile = window.innerWidth < 768;
                const cardWidth = isMobile ? 240 : 300;
                const spacingPadding = isMobile ? 120 : 300;
                const radius = Math.round((cardWidth / 2) / Math.tan(Math.PI / totalCards)) + spacingPadding;
                const front = frontIndex();

                cards.forEach((card, i) => {
                    card.style.transform = `rotateY(${i * theta}deg) translateZ(${radius}px)`;
                    const absOffset = Math.abs(wrapOffset(i - front));
                    const isFront = absOffset === 0;
                    card.classList.toggle('active', isFront);
                    card.style.opacity = isFront ? 1 : Math.max(0, 1 - absOffset * 0.3);
                    card.setAttribute('aria-hidden', String(!isFront));
                    card.querySelector('.view-btn').tabIndex = isFront ? 0 : -1;
                });

                const work = carouselData[front];
                caption.textContent = `${front + 1} / ${totalCards} · ${work.title}`;
                carouselAmbient = work;
                // Let the 0.8s spin finish before the light changes, so the two never share frames
                if (!hoveringFrame) restoreAmbient(700);

                scene.style.transform = `translateZ(${-radius}px) rotateY(${activeIndex * -theta}deg)`;
            }

            const step = (dir) => { activeIndex += dir; updateCarousel(); };
            document.getElementById('btn-prev').addEventListener('click', () => { step(-1); pauseAutoplay(); });
            document.getElementById('btn-next').addEventListener('click', () => { step(1); pauseAutoplay(); });
            viewport.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') { step(-1); pauseAutoplay(); }
                if (e.key === 'ArrowRight') { step(1); pauseAutoplay(); }
            });

            // Pointer drag/swipe (mouse + touch)
            let startX = 0, dragging = false, dragMoved = false;
            viewport.addEventListener('pointerdown', (e) => {
                startX = e.clientX; dragging = true; dragMoved = false;
            });
            window.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                if (Math.abs(e.clientX - startX) > 8) { dragMoved = true; viewport.classList.add('dragging'); }
            });
            window.addEventListener('pointerup', (e) => {
                if (!dragging) return;
                dragging = false;
                viewport.classList.remove('dragging');
                const diff = startX - e.clientX;
                if (Math.abs(diff) > 40) { step(diff > 0 ? 1 : -1); pauseAutoplay(); }
                // Let the click that follows a drag see dragMoved, then reset it
                setTimeout(() => { dragMoved = false; }, 0);
            });
            window.addEventListener('pointercancel', () => { dragging = false; viewport.classList.remove('dragging'); });

            // Slow autoplay, paused on interaction or when off-screen
            let autoplay = null, autoplayResume = null;
            function startAutoplay() {
                if (reduceMotion || autoplay) return;
                autoplay = setInterval(() => step(1), 5000);
            }
            function stopAutoplay() { clearInterval(autoplay); autoplay = null; }
            function pauseAutoplay() {
                stopAutoplay();
                clearTimeout(autoplayResume);
                autoplayResume = setTimeout(() => { if (carouselInView) startAutoplay(); }, 12000);
            }
            viewport.addEventListener('mouseenter', stopAutoplay);
            viewport.addEventListener('mouseleave', () => { if (carouselInView) startAutoplay(); });

            new IntersectionObserver(([entry]) => {
                carouselInView = entry.isIntersecting;
                if (carouselInView) startAutoplay(); else stopAutoplay();
                if (!hoveringFrame) restoreAmbient();
            }, { threshold: 0.25 }).observe(viewport);

            let resizeRaf;
            window.addEventListener('resize', () => {
                cancelAnimationFrame(resizeRaf);
                resizeRaf = requestAnimationFrame(updateCarousel);
            });

            // ============ 2. ROOMS ============
            const roomsEl = document.getElementById('rooms');
            const roomLinks = document.getElementById('room-links');
            let hoveringFrame = false;

            galleryRooms.forEach((room) => {
                const works = myGalleryData.filter((w) => w.room === room.id);
                if (!works.length) return;

                roomLinks.insertAdjacentHTML('beforeend', `
                    <a href="#room-${room.id}" data-room="${room.id}" class="room-link shrink-0 text-[11px] font-semibold uppercase tracking-[0.2em] pb-1 transition-colors">
                        <span class="opacity-60 mr-1">${room.numeral}</span> ${escapeHtml(room.title)}
                    </a>`);

                const section = document.createElement('section');
                section.className = 'room pt-24 md:pt-32';
                section.id = `room-${room.id}`;
                section.innerHTML = `
                    <header class="mb-14 md:mb-20 grid md:grid-cols-[auto,1fr] gap-x-10 gap-y-4 items-end">
                        <div>
                            <p class="text-[11px] font-semibold tracking-[0.35em] uppercase text-primary mb-3">Room ${room.numeral}</p>
                            <h2 class="font-display text-4xl md:text-5xl italic leading-none">${escapeHtml(room.title)}</h2>
                        </div>
                        <div class="md:border-l md:pl-10 border-black/10 dark:border-white/10">
                            <p class="font-light text-sm md:text-[15px] leading-relaxed text-text-secondary-light dark:text-text-secondary-dark max-w-md">${escapeHtml(room.intro)}</p>
                            <p class="mt-3 text-[10px] uppercase tracking-[0.25em] text-text-secondary-light/70 dark:text-text-secondary-dark/70">${works.length} ${works.length === 1 ? 'work' : 'works'}</p>
                        </div>
                    </header>
                    <div class="wall">
                        ${works.map((work, i) => `
                            <figure class="work" id="w-${work.id}" data-id="${work.id}" style="--d:${(i % 3) * 0.12}s">
                                <a href="${detailUrl(work)}" class="block group" aria-label="${escapeHtml(work.title)}, ${escapeHtml(work.type)}">
                                    <div class="frame">
                                        <div class="mat">
                                            <img src="${work.images[0].sm}" alt="${escapeHtml(work.title)}" width="540" height="720" loading="lazy" decoding="async"/>
                                        </div>
                                        <span class="heart-badge"><span class="material-symbols-outlined fill-icon text-[16px]">favorite</span></span>
                                    </div>
                                    <figcaption class="placard">
                                        <h3 class="font-display text-lg md:text-xl italic leading-snug">${escapeHtml(work.title)}</h3>
                                        <p class="mt-1 text-[10px] uppercase tracking-[0.18em] text-text-secondary-light dark:text-text-secondary-dark font-semibold">
                                            ${escapeHtml(work.type)}${work.year ? ` · ${work.year}` : ''}
                                        </p>
                                        <p class="mt-1 text-[10px] uppercase tracking-[0.18em] text-text-secondary-light/70 dark:text-text-secondary-dark/70">
                                            No. ${work.no}${work.images.length > 1 ? ` · ${work.images.length} views` : ''}
                                        </p>
                                    </figcaption>
                                </a>
                            </figure>
                        `).join('')}
                    </div>
                `;
                roomsEl.appendChild(section);
            });

            // ============ 2b. THE ARTIST ============
            const artistName = artist.name || `${gallery.title} Studio`;
            const initials = artist.name
                ? artist.name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase()
                : 'O';

            // Every vivid bead colour in the collection, in exhibition order
            const collectionColours = [...new Set(myGalleryData.flatMap((w) => w.palette)
                .filter((hex) => { const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)); return Math.max(...c) - Math.min(...c) > 46; }))];

            // Without a photo, the portrait is a strand strung from the whole collection's palette
            function beadPortrait() {
                const beads = 38;
                const svgBeads = Array.from({ length: beads }, (_, i) => {
                    const t = (i / beads) * Math.PI * 2 - Math.PI / 2;
                    const x = 150 + Math.cos(t) * 102;
                    const y = 205 + Math.sin(t) * 140;
                    const r = i % 5 === 0 ? 11 : i % 2 ? 8 : 9.5;
                    const fill = collectionColours[(i * 7) % collectionColours.length];
                    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${fill}"/>
                            <circle cx="${(x - r / 3).toFixed(1)}" cy="${(y - r / 3).toFixed(1)}" r="${(r / 3).toFixed(1)}" fill="#fff" opacity=".45"/>`;
                }).join('');
                return `
                    <svg viewBox="0 0 300 400" class="w-full h-full" role="img" aria-label="${escapeHtml(artistName)}, portrait in beads">
                        
                        <ellipse cx="150" cy="205" rx="102" ry="140" fill="none" stroke="#b9ad97" stroke-width="1"/>
                        ${svgBeads}
                        <text x="150" y="226" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-size="64" fill="#262626">${escapeHtml(initials)}</text>
                    </svg>`;
            }

            document.getElementById('artist-portrait').innerHTML = artist.portrait
                ? `<img src="${artist.portrait}" alt="Portrait of ${escapeHtml(artistName)}" class="w-full h-full object-cover" loading="lazy"/>`
                : beadPortrait();
            document.getElementById('artist-plaque-name').textContent = artist.portrait ? `Portrait of ${artistName}` : 'Portrait, in the collection’s colours';
            document.getElementById('artist-plaque-meta').textContent = artist.portrait ? 'Photograph' : `${collectionColours.length} colours from the collection`;
            document.getElementById('artist-name').textContent = artistName;
            // Until a name is set, describe the studio rather than a person
            const roleLine = artist.name ? artist.role : catalogue.entry.craft;
            document.getElementById('artist-role').textContent = [roleLine, artist.location].filter(Boolean).join(' · ');
            if (artist.quote) {
                const q = document.getElementById('artist-quote');
                q.textContent = `“${artist.quote}”`;
                q.hidden = false;
            }
            document.getElementById('artist-bio').innerHTML = artist.bio.map((p) => `<p>${escapeHtml(p)}</p>`).join('');

            const years = myGalleryData.map((w) => w.year).filter(Boolean);
            document.getElementById('artist-facts').innerHTML = [
                ['Working since', Math.min(...years)],
                ['Works on view', myGalleryData.length],
                ['Rooms', galleryRooms.length],
            ].map(([label, value], i) => `
                <div class="${i ? 'border-l border-black/10 dark:border-white/10 pl-4' : ''}">
                    <dt class="text-[10px] uppercase tracking-wider text-text-secondary-light dark:text-text-secondary-dark mb-2">${label}</dt>
                    <dd class="font-display text-2xl">${value}</dd>
                </div>`).join('');

            // Counted from the catalogue, most-used first; each one searches the collection
            // The catalogue can name its signature materials; otherwise count the works' own lists
            const materialTerms = artist.materials ||
                [...new Set(myGalleryData.flatMap((w) => w.materials.toLowerCase().split(',').map((m) => m.trim())))];
            const materialCounts = materialTerms
                .map((term) => [term, myGalleryData.filter((w) => w.materials.toLowerCase().includes(term)).length])
                .filter(([, n]) => n > 0)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 8);
            document.getElementById('artist-materials').innerHTML = materialCounts.map(([term, n]) => `
                <button type="button" data-material="${term}" class="material-chip rounded-full px-3.5 py-1.5 text-xs capitalize">
                    ${term} <span class="opacity-50 ml-1">${n}</span>
                </button>`).join('');

            document.getElementById('artist-links').innerHTML = artist.links.map((l) => `
                <a href="${escapeHtml(l.href)}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium bg-gray-900 dark:bg-white text-white dark:text-gray-900 hover:bg-primary dark:hover:bg-primary dark:hover:text-white transition-colors">
                    ${escapeHtml(l.label)} <span class="material-symbols-outlined text-[16px]">north_east</span>
                </a>`).join('');

            document.getElementById('artist-works').innerHTML = myGalleryData.filter((w) => w.featured).map((w) => `
                <a href="${detailUrl(w)}" class="artist-work group block">
                    <span class="block overflow-hidden bg-black/5 shadow-md">
                        <img src="${w.images[0].sm}" alt="${escapeHtml(w.title)}" class="w-full aspect-[3/4] object-cover" loading="lazy"/>
                    </span>
                    <span class="block mt-2 font-display italic text-sm truncate group-hover:text-primary transition-colors">${escapeHtml(w.title)}</span>
                </a>`).join('');

            // Reveal works as the visitor walks past them
            const revealer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        const el = entry.target;
                        el.classList.add('in-view');
                        revealer.unobserve(el);
                        // The stagger delay is for the entrance only; hover dimming should be instant
                        el.addEventListener('transitionend', () => el.style.setProperty('--d', '0s'), { once: true });
                    }
                });
            }, { rootMargin: '0px 0px -8% 0px', threshold: 0.1 });
            document.querySelectorAll('.work').forEach((el) => revealer.observe(el));

            // Spotlight + ambient on hover; view transition on click
            let spotlight = null;
            roomsEl.addEventListener('pointermove', (e) => {
                const frame = e.target.closest('.frame');
                if (!frame) return;
                if (!spotlight) requestAnimationFrame(() => {
                    const { frame, x, y } = spotlight;
                    const r = frame.getBoundingClientRect();
                    frame.style.setProperty('--mx', `${x - r.left}px`);
                    frame.style.setProperty('--my', `${y - r.top}px`);
                    spotlight = null;
                });
                spotlight = { frame, x: e.clientX, y: e.clientY };
            });

            // Suspend hover effects while scrolling (see .is-scrolling in the CSS)
            let scrollIdle;
            window.addEventListener('scroll', () => {
                if (!document.body.classList.contains('is-scrolling')) {
                    document.body.classList.add('is-scrolling');
                    if (hoveringFrame) { hoveringFrame = false; restoreAmbient(); }
                }
                clearTimeout(scrollIdle);
                scrollIdle = setTimeout(() => document.body.classList.remove('is-scrolling'), 150);
            }, { passive: true });
            roomsEl.addEventListener('mouseover', (e) => {
                const fig = e.target.closest('.work');
                if (!fig || fig.contains(e.relatedTarget)) return;
                hoveringFrame = true;
                // The light spills out from the piece itself
                const r = fig.querySelector('.frame').getBoundingClientRect();
                const at = [((r.left + r.width / 2) / innerWidth) * 100, ((r.top + r.height / 2) / innerHeight) * 100].map(Math.round);
                setAmbient(findWork(fig.dataset.id), 50, at);
            });
            roomsEl.addEventListener('mouseout', (e) => {
                const fig = e.target.closest('.work');
                if (!fig || fig.contains(e.relatedTarget)) return;
                hoveringFrame = false;
                restoreAmbient();
            });
            roomsEl.addEventListener('click', (e) => {
                const link = e.target.closest('.work a');
                if (!link || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
                e.preventDefault();
                const fig = link.closest('.work');
                goToWork(findWork(fig.dataset.id), fig.querySelector('img'));
            });

            // Name the clicked image so the browser can morph it into the detail view
            function goToWork(work, imgEl) {
                document.querySelectorAll('[style*="view-transition-name"]').forEach((el) => (el.style.viewTransitionName = ''));
                if (imgEl) imgEl.style.viewTransitionName = 'artwork';
                window.location.href = detailUrl(work);
            }

            // Touch screens can't hover, so the piece passing through the middle of the
            // screen lights the room instead. setAmbient's delay means this only repaints
            // once the visitor pauses, not on every work that scrolls past.
            if (window.matchMedia('(hover: none)').matches) {
                const centred = new Set();
                const focusSpy = new IntersectionObserver((entries) => {
                    entries.forEach((e) => (e.isIntersecting ? centred.add(e.target) : centred.delete(e.target)));
                    const fig = [...centred].pop();
                    if (!fig) { centredWork = null; restoreAmbient(600); return; }
                    const r = fig.querySelector('.frame').getBoundingClientRect();
                    const at = [((r.left + r.width / 2) / innerWidth) * 100, ((r.top + r.height / 2) / innerHeight) * 100].map(Math.round);
                    centredWork = { work: findWork(fig.dataset.id), at };
                    restoreAmbient(300);
                }, { rootMargin: '-38% 0px -38% 0px' });
                roomsEl.querySelectorAll('.work').forEach((el) => focusSpy.observe(el));
            }

            // Highlight the current room in the nav
            roomLinks.insertAdjacentHTML('beforeend', `
                <a href="#room-artist" data-room="artist" class="room-link shrink-0 text-[11px] font-semibold uppercase tracking-[0.2em] pb-1 transition-colors">
                    <span class="material-symbols-outlined text-[14px] align-[-2px] opacity-60 mr-1">person</span> The Artist
                </a>`);

            const roomSpy = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    const link = roomLinks.querySelector(`[data-room="${entry.target.id.replace('room-', '')}"]`);
                    roomLinks.querySelectorAll('.room-link').forEach((a) => a.classList.toggle('active', a === link));
                    // Keep the active room visible in the scrollable nav on narrow screens
                    roomLinks.scrollTo({ left: link.offsetLeft - roomLinks.clientWidth / 2 + link.offsetWidth / 2, behavior: reduceMotion ? 'auto' : 'smooth' });
                });
            }, { rootMargin: '-45% 0px -50% 0px' });
            document.querySelectorAll('.room').forEach((room) => roomSpy.observe(room));

            // ============ 3. FAVOURITES ============
            // Saved works span every gallery in the hall ("artist/work" keys)
            function syncFavourites() {
                const favs = Artestoa.readSaved();
                document.querySelectorAll('.work[data-id]').forEach((el) => el.classList.toggle('is-fav', favs.includes(`${catalogue.slug}/${el.dataset.id}`)));
                const badge = document.getElementById('saved-count');
                badge.textContent = favs.length;
                badge.classList.toggle('hidden', favs.length === 0);
                document.getElementById('saved-summary').textContent = favs.length
                    ? `You've saved ${favs.length} ${favs.length === 1 ? 'piece' : 'pieces'} across the hall. Find them under the heart in the dock.`
                    : 'Tap the heart on any piece to save it for later.';
            }
            syncFavourites();
            window.addEventListener('storage', syncFavourites);
            // Returning via the back button restores this page from bfcache; refresh state
            window.addEventListener('pageshow', (e) => { if (e.persisted) { syncFavourites(); restoreAmbient(); } });

            // ============ 4. DOCK & SHEET ============
            const sheet = document.getElementById('sheet');
            const sheetTitle = document.getElementById('sheet-title');
            const sheetList = document.getElementById('sheet-list');
            const searchWrap = document.getElementById('search-wrap');
            const searchInput = document.getElementById('search-input');
            let lastFocus = null;

            const listItem = (work) => `
                <li>
                    <a href="${detailUrl(work)}" class="flex items-center gap-4 p-3 rounded-2xl hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                        <img src="${work.images[0].sm}" alt="" class="w-14 h-[72px] object-cover rounded-md shadow" loading="lazy"/>
                        <span class="flex-1 min-w-0">
                            <span class="block font-display text-lg italic truncate">${escapeHtml(work.title)}</span>
                            <span class="block text-[10px] uppercase tracking-[0.18em] text-text-secondary-light dark:text-text-secondary-dark">
                                ${work.artist === catalogue.slug ? `Room ${roomOf(work).numeral}` : escapeHtml(Artestoa.registryEntry(work.artist)?.name || '')} · ${escapeHtml(work.type)}${work.year ? ` · ${work.year}` : ''}
                            </span>
                        </span>
                        <span class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark">arrow_forward</span>
                    </a>
                </li>`;
            const emptyItem = (msg) => `<li class="px-3 py-10 text-center text-sm text-text-secondary-light dark:text-text-secondary-dark">${msg}</li>`;

            function renderSearch() {
                const q = searchInput.value.trim().toLowerCase();
                const results = myGalleryData.filter((w) =>
                    !q || [w.title, w.type, w.materials, w.description, w.series, roomOf(w).title, w.year]
                        .filter(Boolean).join(' ').toLowerCase().includes(q));
                sheetList.innerHTML = results.length ? results.map(listItem).join('') : emptyItem(`Nothing in the collection matches “${escapeHtml(q)}”.`);
            }

            function openSheet(kind) {
                lastFocus = document.activeElement;
                sheet.hidden = false;
                document.body.style.overflow = 'hidden';
                if (kind === 'search') {
                    sheetTitle.textContent = 'Search the collection';
                    searchWrap.hidden = false;
                    renderSearch();
                    searchInput.focus();
                } else {
                    sheetTitle.textContent = 'Saved works';
                    searchWrap.hidden = true;
                    sheetList.innerHTML = '';
                    sheet.querySelector('[data-close]:not(.absolute)').focus();
                    // Saved works from every gallery in the hall
                    Artestoa.savedWorks().then((favs) => {
                        if (sheet.hidden || searchWrap.hidden === false) return;
                        sheetList.innerHTML = favs.length ? favs.map(listItem).join('') : emptyItem('Nothing saved yet. Open any piece and tap the heart to keep it here.');
                    });
                }
            }
            function closeSheet() {
                sheet.hidden = true;
                document.body.style.overflow = '';
                lastFocus?.focus();
            }

            searchInput.addEventListener('input', renderSearch);
            sheet.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeSheet(); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !sheet.hidden) closeSheet();
                if (e.key === '/' && sheet.hidden && !/input|textarea/i.test(document.activeElement.tagName)) {
                    e.preventDefault(); openSheet('search');
                }
            });

            document.getElementById('artist-materials').addEventListener('click', (e) => {
                const chip = e.target.closest('[data-material]');
                if (!chip) return;
                openSheet('search');
                searchInput.value = chip.dataset.material;
                renderSearch();
            });

            document.querySelectorAll('[data-dock]').forEach((btn) => btn.addEventListener('click', () => {
                const kind = btn.dataset.dock;
                if (kind === 'rooms') document.getElementById('rooms').scrollIntoView();
                else if (kind === 'artist') document.getElementById('room-artist').scrollIntoView();
                else openSheet(kind);
            }));

            // ============ 5. ARRIVALS ============
            // Coming back from a work (index.html#w-<id>): mark where the visitor was standing
            // Arriving with a #hash: the rooms above it are built by script, after the browser's
            // own anchor jump, so jump again now and once styles/fonts have settled the layout.
            // Coming back from a work (#w-<id>) also marks where the visitor was standing.
            function markVisited() {
                const target = location.hash.length > 1 && document.getElementById(decodeURIComponent(location.hash.slice(1)));
                if (!target) return;
                const isWork = target.classList.contains('work');
                const jump = () => target.scrollIntoView({ block: isWork ? 'center' : 'start', behavior: 'instant' });
                jump();
                if (document.readyState !== 'complete') window.addEventListener('load', jump, { once: true });
                if (isWork) {
                    target.classList.add('in-view', 'just-visited');
                    setTimeout(() => target.classList.remove('just-visited'), 2600);
                }
            }

            updateCarousel();
            startAutoplay();
            markVisited();
        });
    </script>
</body>
</html>
